# Minecraft / Fabric versions - matches fabric.mod.json ("minecraft": "1.21.4")
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.14

# Fabric API - latest release published for 1.21.4 (verified via web search on 2026-08-10)
fabric_version=0.119.2+1.21.4

# Mod info
mod_version=3.2.0
maven_group=padej.soup
archives_base_name=soupapi

# Extra libraries the decompiled code depends on
mixinextras_version=0.5.4
jna_version=5.14.0
commons_io_version=2.16.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Forces the Gradle daemon itself (not just javac) to run on JDK 21.
# Without this, if your system's default/"current" Java is a newer JDK
# (e.g. 24/25), Gradle 8.14.3 can fail just parsing build.gradle with
# "Unsupported class file major version" - this is separate from the
# java{ toolchain{} } block in build.gradle, which only controls what
# JDK your Java *code* is compiled with.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.8-hotspot
